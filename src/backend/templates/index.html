<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botonera Evento</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0d0d;
    --surface: #1a1a1a;
    --card:    #242424;
    --border:  #333;
    --text:    #e8e8e8;
    --muted:   #888;
    --playing-bg: #1a2e1a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; }
  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }
  #status-dot.ok  { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  #status-dot.err { background: #f44336; }

  /* ── Categories ─────────────────────────── */
  #cats {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .cat-btn {
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    white-space: nowrap;
    color: #000;
    position: relative;
  }
  .cat-btn:hover  { opacity: .85; transform: scale(1.04); }
  .cat-btn.active { outline: 2px solid #fff; outline-offset: 2px; }
  .cat-badge {
    font-size: .65rem;
    font-weight: 700;
    background: rgba(0,0,0,.35);
    border-radius: 10px;
    padding: 1px 5px;
    margin-left: 4px;
    color: #fff;
  }

  /* ── Main area ───────────────────────────── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Track list ──────────────────────────── */
  #track-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #search-bar {
    padding: 8px 12px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  #search {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 10px;
    font-size: .85rem;
    outline: none;
  }
  #search:focus { border-color: #666; }
  #track-count { color: var(--muted); font-size: .78rem; }

  #tracks {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  #tracks::-webkit-scrollbar { width: 6px; }
  #tracks::-webkit-scrollbar-track { background: var(--bg); }
  #tracks::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

  .track-item {
    display: flex;
    align-items: center;
    padding: 8px 14px;
    cursor: pointer;
    gap: 10px;
    border-bottom: 1px solid #1c1c1c;
    transition: background .1s;
  }
  .track-item:hover   { background: var(--card); }
  .track-item.playing { background: var(--playing-bg); }
  .track-num {
    color: var(--muted);
    font-size: .72rem;
    width: 28px;
    text-align: right;
    flex-shrink: 0;
  }
  .track-name {
    flex: 1;
    font-size: .85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track-play-ico {
    color: var(--muted);
    font-size: .9rem;
    flex-shrink: 0;
    opacity: 0;
  }
  .track-item:hover .track-play-ico  { opacity: 1; }
  .track-item.playing .track-play-ico { opacity: 1; color: #4caf50; }
  #no-tracks { color: var(--muted); text-align: center; padding: 40px; font-size: .9rem; }

  /* ── Player bar ──────────────────────────── */
  #player {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .ctrl-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1.1rem;
    width: 40px; height: 40px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
    flex-shrink: 0;
  }
  .ctrl-btn:hover       { background: var(--card); border-color: #555; }
  .ctrl-btn.active      { background: #2e7d32; border-color: #4caf50; }
  .ctrl-btn:disabled    { opacity: .35; cursor: not-allowed; }
  #btn-stop:hover { background: #3a1a1a; border-color: #f44336; }

  #now-playing {
    flex: 1;
    overflow: hidden;
  }
  #np-track {
    font-size: .88rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #np-state {
    font-size: .72rem;
    color: var(--muted);
    margin-top: 2px;
  }

  #vol-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #vol-icon { font-size: 1rem; }
  #volume {
    -webkit-appearance: none;
    width: 100px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  #volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--text);
    cursor: pointer;
  }
  #vol-val { font-size: .78rem; color: var(--muted); width: 28px; }

  /* responsive */
  @media (max-width: 520px) {
    .cat-btn { padding: 5px 10px; font-size: .72rem; }
    #vol-wrap { display: none; }
  }
</style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>🎵 BOTONERA</h1>
  <span id="header-cat" style="color:#888;font-size:.85rem;"></span>
</header>

<div id="cats"></div>

<div id="main">
  <div id="track-panel">
    <div id="search-bar">
      <input id="search" type="text" placeholder="Buscar track..." autocomplete="off">
      <span id="track-count"></span>
    </div>
    <div id="tracks"><div id="no-tracks">Selecciona una categoría</div></div>
  </div>
</div>

<div id="player">
  <button class="ctrl-btn" id="btn-play"  title="Play">▶</button>
  <button class="ctrl-btn" id="btn-pause" title="Pausa">⏸</button>
  <button class="ctrl-btn" id="btn-stop"  title="Detener" id="btn-stop">⏹</button>
  <div id="now-playing">
    <div id="np-track">Sin reproducción</div>
    <div id="np-state">detenido</div>
  </div>
  <div id="vol-wrap">
    <span id="vol-icon">🔊</span>
    <input id="volume" type="range" min="0" max="100" value="70">
    <span id="vol-val">70%</span>
  </div>
</div>

<script>
const API = '';
let categories    = [];
let currentCat    = null;
let allTracks     = [];
let currentTrack  = null;
let statusInterval = null;

const COLORS = {
  purple: '#9c27b0', red: '#e53935', yellow: '#f9a825',
  blue: '#1976d2',   green: '#388e3c', white: '#9e9e9e',
  orange: '#e65100', pink: '#c2185b', cyan: '#0097a7',
};

// ── Boot ────────────────────────────────────────────────────────
async function boot() {
  await loadCategories();
  startStatusPoll();
  document.getElementById('search').addEventListener('input', filterTracks);
  document.getElementById('btn-play').addEventListener('click', onPlay);
  document.getElementById('btn-pause').addEventListener('click', onPause);
  document.getElementById('btn-stop').addEventListener('click', onStop);
  document.getElementById('volume').addEventListener('input', onVolume);
  document.addEventListener('keydown', onKey);
}

// ── Categories ───────────────────────────────────────────────────
async function loadCategories() {
  try {
    const r = await fetch(`${API}/api/categories`);
    const d = await r.json();
    categories = d.categories || [];
    renderCats();
    if (categories.length) selectCat(0);
  } catch(e) { setDot(false); }
}

function renderCats() {
  const el = document.getElementById('cats');
  el.innerHTML = '';
  categories.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.idx = i;
    const col = COLORS[c.color] || '#666';
    btn.style.background = col;
    btn.style.color = isLight(col) ? '#000' : '#fff';
    btn.innerHTML = `${c.name}<span class="cat-badge">${c.track_count}</span>`;
    if (c.hotkey) btn.title = `Tecla: ${c.hotkey}`;
    btn.addEventListener('click', () => selectCat(i));
    el.appendChild(btn);
  });
}

async function selectCat(idx) {
  currentCat = categories[idx];
  document.querySelectorAll('.cat-btn').forEach((b,i) =>
    b.classList.toggle('active', i == idx));
  document.getElementById('header-cat').textContent = currentCat.name;
  document.getElementById('search').value = '';
  await loadTracks(currentCat.folder);
}

// ── Tracks ───────────────────────────────────────────────────────
async function loadTracks(folder) {
  document.getElementById('tracks').innerHTML = '<div id="no-tracks">Cargando...</div>';
  try {
    const r = await fetch(`${API}/api/tracks?category=${encodeURIComponent(folder)}`);
    const d = await r.json();
    allTracks = d.tracks || [];
    renderTracks(allTracks);
  } catch(e) {
    document.getElementById('tracks').innerHTML = '<div id="no-tracks">Error al cargar tracks</div>';
  }
}

function renderTracks(list) {
  const el = document.getElementById('tracks');
  document.getElementById('track-count').textContent = `${list.length} tracks`;
  if (!list.length) {
    el.innerHTML = '<div id="no-tracks">Sin resultados</div>';
    return;
  }
  el.innerHTML = '';
  list.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'track-item' + (t === currentTrack ? ' playing' : '');
    div.dataset.file = t;
    div.innerHTML = `
      <span class="track-num">${i+1}</span>
      <span class="track-name">${cleanName(t)}</span>
      <span class="track-play-ico">▶</span>`;
    div.addEventListener('click', () => playTrack(t));
    el.appendChild(div);
  });
}

function filterTracks() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = q ? allTracks.filter(t => t.toLowerCase().includes(q)) : allTracks;
  renderTracks(filtered);
}

function cleanName(filename) {
  return filename.replace(/\.[^.]+$/, '').replace(/_/g, ' ');
}

// ── Playback ─────────────────────────────────────────────────────
async function playTrack(file) {
  if (!currentCat) return;
  currentTrack = file;
  highlightTrack(file);
  try {
    const r = await fetch(`${API}/api/play`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ file, category: currentCat.folder })
    });
    const d = await r.json();
    if (d.status === 'playing') {
      setNowPlaying(file, 'reproduciendo');
      document.getElementById('btn-play').classList.add('active');
    }
  } catch(e) { console.error(e); }
}

async function onPlay() {
  if (currentTrack && currentCat) {
    await playTrack(currentTrack);
  }
}

async function onPause() {
  try {
    const r = await fetch(`${API}/api/pause`, { method:'POST' });
    const d = await r.json();
    updatePlayerState(d.status);
  } catch(e) {}
}

async function onStop() {
  try {
    await fetch(`${API}/api/stop`, { method:'POST' });
    updatePlayerState('stopped');
    document.getElementById('btn-play').classList.remove('active');
  } catch(e) {}
}

let volTimer = null;
function onVolume(e) {
  const v = e.target.value;
  document.getElementById('vol-val').textContent = v + '%';
  document.getElementById('vol-icon').textContent = v > 50 ? '🔊' : v > 10 ? '🔉' : '🔈';
  clearTimeout(volTimer);
  volTimer = setTimeout(() => {
    fetch(`${API}/api/volume`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({volume: parseInt(v)})
    });
  }, 200);
}

// ── Status poll ──────────────────────────────────────────────────
function startStatusPoll() {
  statusInterval = setInterval(pollStatus, 1000);
  pollStatus();
}

async function pollStatus() {
  try {
    const r = await fetch(`${API}/api/status`);
    const d = await r.json();
    setDot(true);
    updatePlayerState(d.status);
    if (d.track && d.track !== currentTrack) {
      currentTrack = d.track.split('/').pop();
      setNowPlaying(currentTrack, d.status);
      highlightTrack(currentTrack);
    }
    const vol = d.volume ?? 70;
    document.getElementById('volume').value = vol;
    document.getElementById('vol-val').textContent = vol + '%';
  } catch(e) { setDot(false); }
}

// ── Helpers ──────────────────────────────────────────────────────
function setDot(ok) {
  const d = document.getElementById('status-dot');
  d.className = ok ? 'ok' : 'err';
}

function setNowPlaying(file, state) {
  document.getElementById('np-track').textContent = cleanName(file);
  updatePlayerState(state);
}

function updatePlayerState(state) {
  const stateMap = { playing: '▶ reproduciendo', paused: '⏸ en pausa', stopped: '⏹ detenido', error: '⚠ error' };
  document.getElementById('np-state').textContent = stateMap[state] || state;
  document.getElementById('btn-play').classList.toggle('active', state === 'playing');
}

function highlightTrack(file) {
  document.querySelectorAll('.track-item').forEach(el => {
    el.classList.toggle('playing', el.dataset.file === file);
  });
}

function isLight(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 > 128;
}

function onKey(e) {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (k >= '1' && k <= '9') {
    const idx = categories.findIndex(c => c.hotkey === k);
    if (idx >= 0) selectCat(idx);
  }
  if (k === ' ') { e.preventDefault(); onPause(); }
  if (k === 'Escape') onStop();
}

boot();
</script>
</body>
</html>
